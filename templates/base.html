<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LSM's blog{% endblock %}</title>
    <link href="{{ url_for('static', filename='styles/tailwind.css') }}" rel="stylesheet">
    {% block head_extra %}{% endblock %}
</head>
<body class="flex flex-col min-h-screen font-sans bg-gray-50 text-gray-900">

<header class="bg-gray-900 text-white">
    <nav class="container mx-auto flex justify-between items-center p-4">
        <a href="/" class="text-xl font-bold">MySite</a>
        <ul class="flex space-x-6">
            <li><a href="/" class="hover:text-gray-400">Home</a></li>
            <li><a href="/posts" class="hover:text-gray-400">Posts</a></li>
        </ul>
    </nav>
</header>

<main class="flex-1 container mx-auto p-4">
    {% block main %}{% endblock %}
</main>

<footer class="bg-gray-900 text-white mt-8">
    <div class="container mx-auto p-4 flex flex-col md:flex-row justify-between items-center">
        <p class="text-sm">&copy; MySite 2024</p>
        <div class="flex space-x-4 mt-2 md:mt-0">
            <a href="link-to-github" class="hover:text-gray-400">Github</a>
            <a href="link-to-linkedin" class="hover:text-gray-400">LinkedIn</a>
        </div>
    </div>
</footer>

</body>
</html>
