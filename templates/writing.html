{% extends "base.html" %}
{% block title %}Edit Post{% endblock %}
{% block main %}

<section class="max-w-5xl mx-auto p-4 space-y-8">
    <!-- Post Edit Form -->
    <form action="/edit/{{post['id']}}" method="post" id="write_form" class="bg-white shadow-md rounded-lg p-6 space-y-4">
        <div>
            <label class="block font-semibold mb-1">Title</label>
            <input type="text" name="title" value="{{post['title']}}" class="w-full border rounded p-2">
        </div>

        <div>
            <label class="block font-semibold mb-1">Image Path</label>
            <input type="text" name="image_path" value="{{post['main_image']}}" class="w-full border rounded p-2">
        </div>

        <div>
            <label class="block font-semibold mb-1">Description</label>
            <textarea name="description" id="description" class="w-full border rounded p-2">{{post['description']}}</textarea>
        </div>

        <div class="flex items-center space-x-2">
            <input type="checkbox" name="public" id="public" {% if post["public"] %} checked {%endif%} class="w-4 h-4">
            <label for="public" class="text-sm">Public</label>
        </div>

        <div>
            <label class="block font-semibold mb-2">Content</label>
            <div class="flex justify-between items-center">
                <span class="text-sm text-gray-500">Markdown supported</span>
                <button type="button" id="preview-button" class="px-3 py-1 text-sm bg-blue-500 text-white rounded">Preview</button>
            </div>
        </div>

        <textarea name="content" id="content" class="w-full border rounded p-2 min-h-[200px]">{{post['content']}}</textarea>

        <div id="preview" class="hidden border rounded p-1 pt-6 mx-auto bg-gray-50 prose prose-sm"></div>

        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Save post</button>
    </form>

    <!-- Image Browser -->
    <div class="mt-6">
        <h2 class="text-lg font-bold mb-2">Images</h2>
        <div id="image-grid" class="grid grid-cols-3 gap-4 border p-4 rounded bg-white">
            <!-- Images will be loaded here by JS -->
        </div>

        <div class="flex justify-between mt-2">
            <button id="prev-btn" class="px-3 py-1 bg-gray-200 rounded">Prev</button>
            <span id="page-info">Page 1</span>
            <button id="next-btn" class="px-3 py-1 bg-gray-200 rounded">Next</button>
        </div>
    </div>

    <!-- Image Upload -->
    <div>
        <h2 class="text-lg font-bold mb-2">Image Upload</h2>
        <div class="border p-4 rounded bg-white space-y-3">
            <input type="file" name="file" id="file_input" class="block w-full">
            <button id="upload" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save</button>
            <p id="upload_message" class="text-sm text-gray-600"></p>
        </div>
    </div>

    <!-- Delete post -->
    <div>
        <button id="delete" class="text-red-600 hover:underline">Delete blog post</button>
    </div>
</section>

<!-- MathJax -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
  }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
<!-- Markdown-it -->
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script>
    const content = document.getElementById("content");
    const preview = document.getElementById("preview");
    const preview_button = document.getElementById("preview-button");

    const md = window.markdownit({
        html: true,
        linkify: true,
        typographer: true
    });

    function content_update() {
        content.style.height = `${content.scrollHeight - 4}px`;
        const text = content.value;
        preview.innerHTML = md.render(text);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([preview]).catch(err => console.error(err));
        }
    }
    content.addEventListener('input', content_update);
    content_update();

    preview_button.addEventListener("click", () => {
        content.classList.toggle("hidden");
        preview.classList.toggle("hidden");
    });

    // Image loading and pagination
    let currentPage = 1;
    let totalPages = 1;
    const postId = {{ post.id }};
    const imageGrid = document.getElementById('image-grid');
    const pageInfo = document.getElementById('page-info');

    function loadImages(page) {
        fetch(`/edit/${postId}/images?page=${page}`)
            .then(res => res.json())
            .then(data => {
                imageGrid.innerHTML = '';
                totalPages = data.total_pages;
                pageInfo.textContent = `Page ${data.page} / ${totalPages}`;
                data.images.forEach(img => {
                    const imageEl = document.createElement('img');
                    imageEl.src = img.src;
                    imageEl.title = img.id;
                    imageEl.className = 'img_preview cursor-pointer border rounded max-h-32';
                    imageEl.addEventListener('click', () => {
                        const content = document.getElementById('content');
                        content.value += `\n![image](${img.src})\n`;
                        if (typeof content_update === 'function') content_update();
                    });
                    imageGrid.appendChild(imageEl);
                });
            });
    }

    // Navigation buttons
    document.getElementById('prev-btn').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            loadImages(currentPage);
        }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
        if (currentPage < totalPages) {
            currentPage++;
            loadImages(currentPage);
        }
    });

    // Initial load
    loadImages(currentPage);


    // Add click event to image previews
    for (let element of document.getElementsByClassName("img_preview")) {
    element.addEventListener("click", () => {
        content.innerHTML += `\n![image](https://lauritssm.dk${element.getAttribute('src')})\n`;
        content_update();
    });
}

    // Image upload functionality
    file_input = document.getElementById("file_input");
    upload_button = document.getElementById("upload");
    upload_message = document.getElementById("upload_message");

    upload_button.addEventListener("click", (event) => {
        event.preventDefault();
        var url = "/upload_image";
        var request = new XMLHttpRequest();
        request.open('POST', url, true);
        request.onload = () => {
            upload_message.innerHTML = "Success";
        };
        request.onerror = () => {
            upload_message.innerHTML = "Error";
        };
        var form_data = new FormData();
        form_data.append('file', file_input.files[0]);
        request.send(form_data);
    });

    // Delete post functionality
    delete_button = document.getElementById("delete");
    delete_button.addEventListener("click", () => {
        if (confirm("Do you want to delete this post?")) {
            window.location.href = "/delete/{{post['id']}}";
        }
    });
</script>
{% endblock %}
